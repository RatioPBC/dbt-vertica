[vars]
vsql = "/opt/vertica/bin/vsql"
container_name = "dbt_vertica"

[tools]
python = "3.11.14"

[env]
CONFORM_DISABLE_FORMAT_FOR_FILETYPES = "sql,python"
SCHEMA_NAME = "dbt_1_8_5"
VERTICA_CONTAINER_NAME = "{{ vars.container_name }}"
VERTICA_USER = "dbadmin"
VERTICA_PASS = ""
VERTICA_HOST = "localhost"
VERTICA_PORT = 5433
VERTICA_DATABASE = "docker"
VERTICA_SCHEMA = "{{ env.SCHEMA_NAME }}"

[tasks."vertica"]
description = "Starts docker compose"
run = "docker compose up"

[tasks."vertica:bash"]
description = "Drops you into bash in the container"
run = "docker exec -it {{ vars.container_name }} bash -l"

[tasks."vertica:vsql"]
description = "Drops you into vsql in the container"
run = "docker exec -it {{ vars.container_name }} {{ vars.vsql }} -w '{{ env.VERTICA_PASS }}'"

[tasks.setup]
description = "Setup dependencies and install package."
run = ["mise run deps", "mise run deps:extract", "mise run deps:install", "mise run install"]

[tasks.deps]
description = "Install Python dependencies"
run = '''
python -m pip install --upgrade pip
pip install build twine pip-tools
'''

[tasks."deps:extract"]
description = "Extract dependencies"
run = "pip-compile -o requirements.txt --extra dev setup.py"

[tasks."deps:install"]
description = "Install dependencies"
run = "pip install -r requirements.txt"

[tasks.install]
description = "Editable dev install via a plain .pth so live macro/source edits load and the dbt namespace merges with core."
# NOTE: `pip install -e .` is intentionally NOT used here. setuptools' modern
# editable install generates an import finder that pins the `dbt` namespace to
# this repo only, shadowing dbt.tests / dbt.adapters.sql from dbt-core and
# breaking the test suite. A plain .pth adds the repo root to sys.path and lets
# this repo's dbt/__init__.py (pkgutil.extend_path) merge with core's namespace.
run = '''
SITE=$(python -c "import site; print(site.getsitepackages()[0])")
# Remove any stale modern-editable finder artifacts from a previous `pip install -e .`
rm -f "$SITE"/__editable__*dbt_vertica* "$SITE"/__editable___dbt_vertica*finder.py
# Point Python at the live source tree
echo "$MISE_PROJECT_ROOT" > "$SITE/dbt-vertica-dev.pth"
python -c "import dbt.adapters.vertica, dbt.tests.fixtures.project; print('dbt-vertica editable install OK (namespace merged)')"
'''

[tasks.test]
run = "python -m pytest ${usage_test}"
usage = '''
arg "<test>" default="test/" 
'''

[tasks."test:basic"]
run = "python -m pytest tests/functional/adapter/test_basic.py"
