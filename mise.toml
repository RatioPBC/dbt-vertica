[vars]
vsql = "/opt/vertica/bin/vsql"
container_name = "dbt_vertica"

[tools]
"http:vsql" = { version = "24.02", url = 'https://ratio-vertica-09e48653-cea9-4b62-ac4f-4ae2a820ea99.t3.tigrisfiles.io/vsql/vsql_{{ version }}_{{ os() }}_{{ arch(x64="amd64") }}' }
python = "3.11.14"
uv = "latest"

[env]
CONFORM_DISABLE_FORMAT_FOR_FILETYPES = "sql,python"
SCHEMA_NAME = "dbt_1_8_5"
VERTICA_CONTAINER_NAME = "{{ vars.container_name }}"
VERTICA_USER = "dbadmin"
VERTICA_PASS = ""
VERTICA_HOST = "localhost"
VERTICA_PORT = 5433
VERTICA_DATABASE = "docker"
VERTICA_SCHEMA = "{{ env.SCHEMA_NAME }}"

[tasks."vertica:start"]
description = "Starts docker compose"
run = "docker compose up -d && docker compose logs -f"
interactive = true

[tasks."vertica:stop"]
description = "Stops docker compose"
run = "docker compose down"

[tasks."vertica:bash"]
description = "Drops you into bash in the container"
run = "docker exec -it {{ vars.container_name }} bash -l"

[tasks."vertica:vsql"]
description = "Drops you into vsql in the container"
run = "docker exec -it {{ vars.container_name }} {{ vars.vsql }} -w '{{ env.VERTICA_PASS }}'"

[tasks."vertica:query"]
description = "Execute a query"
run = 'mise run vertica:vsql -c "${usage_query}"'
usage = '''
arg "<query>" default="select version();"
'''

[tasks.setup]
description = "Create the venv, install deps + editable package from uv.lock."
# `uv sync` creates .venv, installs runtime deps + the `dev` dependency group,
# and installs this package editable. The hatchling backend's dev-mode-dirs
# emits a plain .pth (not an import finder), so this repo's dbt/__init__.py
# (pkgutil.extend_path) merges with dbt-core's `dbt` namespace instead of
# shadowing dbt.tests / dbt.adapters.sql. Live macro/source edits load directly.
run = "uv sync"

[tasks.deps]
description = "Re-resolve and sync dependencies from pyproject.toml into uv.lock."
run = "uv sync"

[tasks.lock]
description = "Update uv.lock to the latest allowed dependency versions."
run = "uv lock --upgrade"

[tasks.test]
description = "Run the test suite."
run = "uv run pytest ${usage_test}"
usage = '''
arg "<test>" default="tests/"
'''

[tasks."test:basic"]
description = "Run the basic functional adapter tests."
run = "uv run pytest tests/functional/adapter/test_basic.py"

[tasks.lint]
description = "Lint and format-check with ruff."
run = "uv run ruff check ."

[tasks.build]
description = "Build the sdist + wheel into dist/."
run = "uv build"
